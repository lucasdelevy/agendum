name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  GO_VERSION: "1.21"
  NODE_VERSION: "18"

jobs:
  build:
    name: Build Lambda Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build all Lambda functions
        run: |
          for dir in cmd/lambda-user cmd/lambda-auth cmd/lambda-task cmd/lambda-team cmd/lambda-list-teams; do
            echo "Building $dir..."
            cd "$dir"
            go mod tidy
            GOOS=linux GOARCH=amd64 go build -o bootstrap main.go
            cd "$GITHUB_WORKSPACE"
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-binaries
          path: cmd/lambda-*/bootstrap
          retention-days: 1

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js (for CDK)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install AWS CDK
        run: npm install -g aws-cdk

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: lambda-binaries
          path: cmd/

      - name: Make bootstrap binaries executable
        run: chmod +x cmd/lambda-*/bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CDK stack
        working-directory: infrastructure
        run: |
          go mod tidy
          cdk deploy --require-approval never
